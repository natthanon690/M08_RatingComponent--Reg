<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Rating Component</title>
</head>

<body>
  <div class="container">
    <div class="card mt-5 bg-light rounded-4 border-0 mt-5 shadow-lg">
      <div class="card-body">
        <!--Rating summary-->
        <div class="row p-5">
          <div class="col-7">
            <h2>What others think about the product</h2>
          </div>
          <div class="col-5">
            <div class="card">
              <div class="card-body text-center">

                <h3 class="display-5 fw-semibold"><i class="fa-solid fa-star text-warning"></i> 4.8</h3>
                <p>Average Rating</p>
              </div>
            </div>
          </div>
        </div>
        <!--Search reviews-->
        <div class="row">
          <div class="col-12 vstack gap-2">
              <div class="input-group">
                <span class="input-group-text rounded-start-5"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" class="form-control rounded-end-5 " placeholder="Search Reviews">
              </div>
            </div>
          </div>
          <div class="row p-5">
            <div class="col-12 vstack gap-2">
              <h2>Ratings</h2>
              <div class="d-flex align-items-center gap-1">
                <span>5</span><i class="fa-solid fa-star text-warning"></i>
                <div class="progress ms-4" role="progressbar" style="height: 10px;width: 100%">
                  <div class="progress-bar bg-warning" style="height: 10px;width: 80%"></div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-1">
                <span>4</span><i class="fa-solid fa-star text-warning"></i>
                <div class="progress ms-4" role="progressbar" style="height: 10px;width: 100%">
                  <div class="progress-bar bg-warning" style="height: 10px;width: 60%"></div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-1">
                <span>3</span><i class="fa-solid fa-star text-warning"></i>
                <div class="progress ms-4" role="progressbar" style="height: 10px;width: 100%">
                  <div class="progress-bar bg-warning" style="height: 10px;width: 20%"></div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-1">
                <span>2</span><i class="fa-solid fa-star text-warning"></i>
                <div class="progress ms-4" role="progressbar" style="height: 10px;width: 100%">
                  <div class="progress-bar bg-warning" style="height: 10px;width: 10%"></div>
                </div>
              </div>
              <div class="d-flex align-items-center gap-1">
                <span>1</span><i class="fa-solid fa-star text-warning"></i>
                <div class="progress ms-4" role="progressbar" style="height: 10px;width: 100%">
                  <div class="progress-bar bg-warning" style="height: 10px;width: 27%"></div>
                </div>
              </div>
          </div>
        </div>

      </div>
    </div>
  </div>


  <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
